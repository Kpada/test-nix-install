name: Package minimal Nix
description: Package official Nix binaries for x86-64 Linux.
inputs:
  nix-version:
    description: Exact Nix release version.
    required: true
  output-directory:
    description: Destination for the archive.
    default: nix-archives
outputs:
  archive:
    description: Absolute path to the tar.zst.
    value: ${{ steps.pack.outputs.archive }}
  archive-name:
    description: Release asset name expected by the installer for this Nix version.
    value: ${{ steps.pack.outputs.archive-name }}
  release-tag:
    description: Archive release tag pinned by this version of the actions.
    value: ${{ steps.pack.outputs.release-tag }}
runs:
  using: composite
  steps:
    - id: pack
      shell: bash
      env:
        NIX_PACKAGE_VERSION: ${{ inputs.nix-version }}
        NIX_PACKAGE_OUTPUT: ${{ inputs.output-directory }}
      run: |
        bash "$GITHUB_ACTION_PATH/prepare.sh" \
          "$NIX_PACKAGE_VERSION" "$NIX_PACKAGE_OUTPUT"

