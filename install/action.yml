name: Install minimal Nix
description: Install a minimal archive on a fresh Linux runner.
inputs:
  archive-url:
    description: HTTPS URL to your release archive, or a local archive for testing.
    required: true
  archive-sha256:
    description: Optional SHA256; omit to skip archive checksum verification.
    required: false
  nix-conf:
    description: Additional nix.conf settings.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NIX_ARCHIVE_SOURCE: ${{ inputs.archive-url }}
        NIX_ARCHIVE_SHA256: ${{ inputs.archive-sha256 }}
        NIX_CONF: ${{ inputs.nix-conf }}
      run: |
        bash "$GITHUB_ACTION_PATH/../install.sh" "$NIX_ARCHIVE_SOURCE" "$NIX_ARCHIVE_SHA256"

