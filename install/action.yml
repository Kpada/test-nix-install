name: Install minimal Nix
description: Install a prepared Nix archive on a fresh x86-64 Ubuntu runner.
inputs:
  archive-url:
    description: HTTPS URL to your release archive, or a local archive for testing.
    required: true
  nix-conf:
    description: Additional nix.conf settings.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NIX_ARCHIVE_SOURCE: ${{ inputs.archive-url }}
        NIX_CONF: ${{ inputs.nix-conf }}
      run: |
        bash "$GITHUB_ACTION_PATH/../install.sh" "$NIX_ARCHIVE_SOURCE"

