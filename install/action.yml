name: Install minimal Nix
description: Install a prepared Nix archive on a fresh x86-64 Ubuntu runner.
inputs:
  nix-version:
    description: Exact Nix version included in the pinned archive release (X.Y.Z).
    required: true
  nix-conf:
    description: Additional nix.conf settings.
    required: false
runs:
  using: composite
  steps:
    - shell: bash
      env:
        NIX_VERSION: ${{ inputs.nix-version }}
        NIX_ARCHIVE_REPOSITORY: ${{ github.action_repository || github.repository }}
        NIX_ARCHIVE_SERVER: ${{ github.server_url }}
        NIX_CONF: ${{ inputs.nix-conf }}
      run: |
        source "$GITHUB_ACTION_PATH/../scripts/archive.sh"
        archive_name="$(nix_archive_name "$NIX_VERSION")"
        archive_url="$NIX_ARCHIVE_SERVER/$NIX_ARCHIVE_REPOSITORY/releases/download/$NIX_ARCHIVE_RELEASE/$archive_name"
        bash "$GITHUB_ACTION_PATH/../install.sh" "$archive_url"

