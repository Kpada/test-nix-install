name: Test Nix installation
on:
  push:
  workflow_dispatch:
    inputs:
      nix_version:
        description: Exact Nix version to install with both actions.
        required: true
        default: "2.34.7"
        type: string
      release_tag:
        description: Existing release of the prepared archive.
        required: true
        default: "nix-2.34.7-r1"
        type: string
permissions:
  contents: read
defaults:
  run:
    shell: bash
env:
  NIX_VERSION: ${{ inputs.nix_version || '2.34.7' }}
  RELEASE_TAG: ${{ inputs.release_tag || 'nix-2.34.7-r1' }}
jobs:
  test:
    name: Install and test Nix (${{ matrix.installer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        installer: [ours, nixbuild]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Start installation timer
        run: printf 'INSTALL_STARTED_NS=%s\n' "$(date +%s%N)" >> "$GITHUB_ENV"
      - name: Install Nix using our action
        if: matrix.installer == 'ours'
        uses: ./install
        with:
          archive-url: ${{ github.server_url }}/${{ github.repository }}/releases/download/${{ env.RELEASE_TAG }}/nix-${{ env.NIX_VERSION }}-x86_64-linux.tar.zst
          nix-conf: |
            sandbox = false
      - name: Install Nix using nixbuild
        if: matrix.installer == 'nixbuild'
        uses: nixbuild/nix-quick-install-action@9f63be77f412a248c9d9a65a4c82cf066cdf8f0c # v35
        with:
          nix_version: ${{ env.NIX_VERSION }}
          enable_kvm: false
          nix_conf: |
            build-users-group =
            sandbox = false
      - name: Record installation time
        env:
          INSTALLER: ${{ matrix.installer }}
        run: |
          elapsed_ms=$(( ($(date +%s%N) - INSTALL_STARTED_NS) / 1000000 ))
          printf '%s: download + installation took %s ms\n' "$INSTALLER" "$elapsed_ms"
          printf '| Action | Download + installation |\n| --- | ---: |\n| %s | %s ms |\n\n' \
            "$INSTALLER" "$elapsed_ms" >> "$GITHUB_STEP_SUMMARY"
      - name: Verify installation and offline build
        run: bash scripts/smoke-test.sh "$NIX_VERSION"
