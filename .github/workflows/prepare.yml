name: Prepare minimal Nix archives
on:
  workflow_dispatch:
    inputs:
      nix_versions:
        description: Exact Nix versions separated by spaces or commas.
        required: true
        default: "2.34.7"
        type: string
      release_tag:
        description: New release tag for all archives.
        required: true
        default: "nix-binaries-r1"
        type: string
permissions:
  contents: write
concurrency:
  group: prepare-minimal-nix
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NIX_VERSIONS: ${{ inputs.nix_versions }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release tag
        run: |
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]]
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release already exists; choose a new revision" >&2
            exit 1
          fi
      - name: Package each Nix version
        run: |
          read -r -a versions <<< "${NIX_VERSIONS//,/ }"
          (( ${#versions[@]} > 0 )) || { echo "Provide at least one Nix version" >&2; exit 1; }
          for version in "${versions[@]}"; do
            bash prepare.sh "$version" nix-archives
          done
      - name: Publish archives
        run: |
          gh release create "$RELEASE_TAG" \
            --target "$GITHUB_SHA" --title "Minimal Nix binaries ($RELEASE_TAG)" \
            --notes "Official Nix binaries for x86-64 Linux. One zstd archive per version. Install using the install action with the chosen archive URL." \
            nix-archives/*.tar.zst
