name: Prepare minimal Nix archives
on:
  workflow_dispatch:
    inputs:
      nix_versions:
        description: Exact Nix versions separated by spaces or commas.
        required: true
        default: "2.34.7"
        type: string
permissions:
  contents: write
concurrency:
  group: prepare-minimal-nix
  cancel-in-progress: false
defaults:
  run:
    shell: bash
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      NIX_VERSIONS: ${{ inputs.nix_versions }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Validate release tag
        run: |
          source scripts/archive.sh
          if gh release view "$NIX_ARCHIVE_RELEASE" >/dev/null 2>&1; then
            echo "Release already exists; bump NIX_ARCHIVE_RELEASE in scripts/archive.sh" >&2
            exit 1
          fi
          existing_tag="$(git ls-remote --tags origin "refs/tags/$NIX_ARCHIVE_RELEASE")"
          if [[ -n "$existing_tag" ]]; then
            echo "Tag already exists; bump NIX_ARCHIVE_RELEASE in scripts/archive.sh" >&2
            exit 1
          fi
          printf 'NIX_ARCHIVE_RELEASE=%s\n' "$NIX_ARCHIVE_RELEASE" >> "$GITHUB_ENV"
      - name: Package each Nix version
        run: |
          read -r -a versions <<< "${NIX_VERSIONS//,/ }"
          (( ${#versions[@]} > 0 )) || { echo "Provide at least one Nix version" >&2; exit 1; }
          for version in "${versions[@]}"; do
            bash prepare.sh "$version" nix-archives
          done
      - name: Publish archives
        run: |
          gh release create "$NIX_ARCHIVE_RELEASE" \
            --target "$GITHUB_SHA" --latest=false \
            --title "Minimal Nix binaries ($NIX_ARCHIVE_RELEASE)" \
            --notes "Official Nix binaries for x86-64 Linux. One zstd archive per version. Use the matching install action version and its nix-version input." \
            nix-archives/*.tar.zst
